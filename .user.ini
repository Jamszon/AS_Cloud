; Limity PHP dla hostingów z PHP-FPM / FastCGI / LiteSpeed,
; gdzie dyrektywy php_value z .htaccess nie działają.
;
; Uwaga: serwer odczytuje ten plik ponownie mniej więcej co 5 minut,
; więc po zmianie wartości odczekaj chwilę przed testem.

; post_max_size musi zmieścić plik zakodowany w base64 (narzut około 1/3),
; bo panel używa tej metody na hostingach bez katalogu tymczasowego.
upload_max_filesize = 16M
post_max_size = 32M
max_execution_time = 120
max_input_time = 120
memory_limit = 128M

; Komunikaty PHP nie mogą trafiać do przeglądarki. Gdyby wypadły przed
; kodem panelu (zdarza się przy problemach z katalogiem tymczasowym),
; zepsułyby nagłówki sesji i odpowiedzi JSON. Trafiają do logu serwera.
display_errors = Off
log_errors = On
